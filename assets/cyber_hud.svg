<svg viewBox="0 0 900 280" width="100%" xmlns="http://w3.org">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF9C"><animate attributeName="stop-color" values="#00FF9C;#00E5FF;#7F52FF;#00FF9C" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#7F52FF"><animate attributeName="stop-color" values="#7F52FF;#00FF9C;#00E5FF;#7F52FF" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00FF9C" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="280" rx="14" fill="#06090F" stroke="url(#cyberGrad)" stroke-width="2.5"/>
  <rect width="900" height="280" rx="14" fill="url(#grid)"/>
  <line x1="0" y1="0" x2="900" y2="0" stroke="#00FF9C" stroke-width="3" stroke-opacity="0.6">
    <animate attributeName="y1" values="0;280;0" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;280;0" dur="3.2s" repeatCount="indefinite"/>
  </line>
  <g transform="translate(780, 140)">
    <circle r="75" fill="none" stroke="#00FF9C" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle r="50" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-dasharray="6 4" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="25" fill="none" stroke="#7F52FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="0" y2="-75" stroke="#00FF9C" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="22" cy="-30" r="4" fill="#00FF9C">
      <animate attributeName="opacity" values="1;0.1;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="45" y="65" fill="#00FF9C" font-family="monospace" font-size="14" letter-spacing="3">[ROOT@HAMZA-EVOLUTION // NEURAL OPS COMMAND CENTER]</text>
  <text x="45" y="125" fill="url(#cyberGrad)" font-family="monospace" font-weight="bold" font-size="38" letter-spacing="2">HAMZA-EVOLUTION</text>
  <text x="45" y="165" fill="#E2E8F0" font-family="monospace" font-size="16">⚡ Autonomous AI Swarms  |  ⚡ Cloud Edge Gateways  |  ⚡ Zero-Token Engines</text>
  <g transform="translate(45, 205)">
    <rect x="0" y="0" width="140" height="8" rx="4" fill="#1E293B"/>
    <rect x="0" y="0" width="140" height="8" rx="4" fill="#00FF9C"><animate attributeName="width" values="20;140;95;140" dur="2.5s" repeatCount="indefinite"/></rect>
    <rect x="160" y="0" width="140" height="8" rx="4" fill="#1E293B"/>
    <rect x="160" y="0" width="140" height="8" rx="4" fill="#00E5FF"><animate attributeName="width" values="120;40;140;120" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="320" y="0" width="140" height="8" rx="4" fill="#1E293B"/>
    <rect x="320" y="0" width="140" height="8" rx="4" fill="#7F52FF"><animate attributeName="width" values="60;140;50;130" dur="1.8s" repeatCount="indefinite"/></rect>
  </g>
  <text x="45" y="245" fill="#38BDF8" font-family="monospace" font-size="13">STATUS: ONLINE [60FPS TELEMETRY] • UPLINK SECURED • ALL DAEMONS ACTIVE</text>
</svg>